services:
  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_PROXY: "edge"
    command:
      - start
      - --proxy=edge
      - --http-enabled=true
      - --hostname=${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      - --hostname-strict=true
      - --http-relative-path=/auth
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../keycloak/themes/finanzapp:/opt/keycloak/themes/finanzapp:ro
    restart: unless-stopped
    networks: [internal]
    mem_limit: 768m

  postgres-lifehub:
    image: postgres:16
    environment:
      POSTGRES_DB: lifehub
      POSTGRES_USER: lifehubuser
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      IDENTITY_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      MOVEMENTS_DB_PASSWORD: ${MOVEMENTS_DB_PASSWORD:?MOVEMENTS_DB_PASSWORD is required}
      TAGS_DB_PASSWORD: ${TAGS_DB_PASSWORD:?TAGS_DB_PASSWORD is required}
    volumes:
      - postgres_lifehub_data:/var/lib/postgresql/data
      - ./postgres/init/lifehub:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks: [internal]
    mem_limit: 512m
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehubuser -d lifehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  lifehub:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finanzapp-lifehub:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      IDENTITY_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      MOVEMENTS_DB_PASSWORD: ${MOVEMENTS_DB_PASSWORD:?MOVEMENTS_DB_PASSWORD is required}
      TAGS_DB_PASSWORD: ${TAGS_DB_PASSWORD:?TAGS_DB_PASSWORD is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      LIFEHUB_INTERNAL_BASE_URL: http://lifehub:8080
    restart: unless-stopped
    networks: [internal]
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      keycloak:
        condition: service_started
      postgres-lifehub:
        condition: service_healthy

volumes:
  kcdata:
  postgres_lifehub_data:

networks:
  internal:
    driver: bridge
