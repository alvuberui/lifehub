name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  modular-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -f pom.xml test -q
