spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/finanzapp

server:
  port: 8080

lifehub:
  internal-base-url: http://localhost:8080
  datasource:
    identity:
      url: jdbc:postgresql://localhost:5437/identitydb?currentSchema=identity
      username: identityuser
      password: ${IDENTITY_DB_PASSWORD:lifehub-local-pass}
      driver-class-name: org.postgresql.Driver
    movements:
      url: jdbc:postgresql://localhost:5437/movementsdb?currentSchema=movements
      username: movementsuser
      password: ${MOVEMENTS_DB_PASSWORD:lifehub-local-pass}
      driver-class-name: org.postgresql.Driver
    tags:
      url: jdbc:postgresql://localhost:5437/tagsdb?currentSchema=tags
      username: tagsuser
      password: ${TAGS_DB_PASSWORD:lifehub-local-pass}
      driver-class-name: org.postgresql.Driver
    home:
      url: jdbc:postgresql://localhost:5437/homedb?currentSchema=home
      username: homeuser
      password: ${HOME_DB_PASSWORD:lifehub-local-pass}
      driver-class-name: org.postgresql.Driver
    connections:
      url: jdbc:postgresql://localhost:5437/connectionsdb?currentSchema=connections
      username: connectionsuser
      password: ${CONNECTIONS_DB_PASSWORD:lifehub-local-pass}
      driver-class-name: org.postgresql.Driver
  monthly-report:
    enabled: ${MONTHLY_REPORT_ENABLED:false}
    dry-run: ${MONTHLY_REPORT_DRY_RUN:true}
    test-endpoint-enabled: ${MONTHLY_REPORT_TEST_ENDPOINT_ENABLED:false}
    time-zone: ${MONTHLY_REPORT_TIME_ZONE:Europe/Madrid}
    cron: "${MONTHLY_REPORT_CRON:0 0 8 * * *}"
    from-email: ${BREVO_FROM_EMAIL:}
    from-name: ${BREVO_FROM_NAME:LifeHub}
    brevo-api-key: ${BREVO_API_KEY:}

services:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
  tag-deletion-processor:
    fixed-delay-ms: 5000
    initial-delay-ms: 5000
